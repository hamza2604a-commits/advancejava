
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b14;
            padding: 20px;
            color: white;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: #6d28d9;
            filter: blur(150px);
            opacity: 0.2;
            top: -150px;
            left: -100px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: #2563eb;
            filter: blur(150px);
            opacity: 0.15;
            bottom: -150px;
            right: -100px;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 650px;
            padding: 50px 40px;
            text-align: center;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.5);
            animation: appear 0.8s ease;
            backdrop-filter: blur(15px);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #fff;
        }

        h1 span {
            color: #a78bfa;
        }

        .subtitle {
            color: #9999ad;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .joke-area {
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(167,139,250,0.2);
            border-radius: 14px;
            margin-bottom: 30px;
            transition: 0.4s ease;
        }

        .joke-area:hover {
            border-color: #8b5cf6;
            box-shadow: 0 0 25px rgba(139,92,246,0.12);
        }

        #para {
            color: #e4e4ef;
            font-size: 17px;
            line-height: 1.9;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button {
            padding: 15px 38px;
            background: linear-gradient(110deg, #7c3aed, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 8px 25px rgba(124,58,237,0.25);
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(124,58,237,0.45);
            background: linear-gradient(110deg, #9333ea, #4f46e5);
        }

        button:active {
            transform: scale(0.96);
        }

        .bottom-text {
            color: #66667a;
            font-size: 12px;
            margin-top: 30px;
        }

        @media(max-width: 500px) {
            .container {
                padding: 35px 20px;
            }

            h1 {
                font-size: 27px;
            }

            #para {
                font-size: 15px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Joke <span>Generator.</span></h1>

        <p class="subtitle">
            A little humor makes every day better.
        </p>

        <div class="joke-area">
            <p id="para">
                Your daily dose of laughter starts here.
            </p>
        </div>

        <button onclick="jokes()">Generate Joke &nbsp; →</button>

        <p class="bottom-text">
            Powered by JokeAPI | Made with JavaScript
        </p>

    </div>

    <script>
        let jokes =async ()=>{
            var jokes_para = document.getElementById('para')
            var response = await fetch('https://v2.jokeapi.dev/joke/Any?blacklistFlags=religious,political')

            var data = await response.json();
            if(data.joke == undefined){
                jokes_para.innerHTML = data.setup + "<br>"+ data.delivery

            }else{
                jokes_para.innerHTML = data.joke
            }
        }
    </script>

</body>
</html>
